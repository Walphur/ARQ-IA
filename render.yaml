services:
  - type: web
    name: arq-ia-api
    env: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arq-ia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        value: https://arq-ia.pro
      - key: ALLOWED_ORIGINS
        value: https://arq-ia.pro,https://www.arq-ia.pro
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\\.onrender\\.com$
      - key: MAX_UPLOAD_MB
        value: 15
      - key: DEMO_RATE_WINDOW_SEC
        value: 3600
      - key: DEMO_RATE_MAX
        value: 30
      - key: TESSERACT_CMD
        value: tesseract
      - key: FREE_MONTHLY_LIMIT
        value: 20
      - key: PAID_MONTHLY_LIMIT
        value: 200
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PREAPPROVAL_PLAN_ID
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_AMOUNT_ARS
        value: "14999"
      - key: MP_CURRENCY
        value: ARS
      - key: MP_REASON
        value: ARQ-IA Plan Pro (mensual)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_NAME
        value: ARQ-IA

  - type: static
    name: arq-ia-web
    rootDir: frontend
    buildCommand: npm ci && rm -rf node_modules/.cache build && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        # Host onrender (failover automatico a api.arq-ia.pro en el frontend)
        value: https://arq-ia-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: arq-ia-db
    plan: starter
