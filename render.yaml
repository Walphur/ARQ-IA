services:
  - type: web
    name: arq-ia-api
    env: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arq-ia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        value: https://arq-ia.pro
      - key: ALLOWED_ORIGINS
        value: https://arq-ia.pro,https://www.arq-ia.pro
      - key: MAX_UPLOAD_MB
        value: 15
      - key: TESSERACT_CMD
        value: tesseract
      - key: FREE_MONTHLY_LIMIT
        value: 20
      - key: PAID_MONTHLY_LIMIT
        value: 500
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: static
    name: arq-ia-web
    rootDir: frontend
    buildCommand: npm ci && rm -rf node_modules/.cache build && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://arq-ia-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: arq-ia-db
    plan: starter
